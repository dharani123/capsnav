# Per-app overrides for capsnav, applied by keyd-application-mapper while a
# matching window has focus (window class; see `keyd-application-mapper -v`).
# Installed to ~/.config/keyd/app.conf. Each binding is set for both the Caps
# layer (nav) and mouse mode (mousemode).

# VS Code: code navigation on the left hand. q/w step back/forward through
# where you've been (instead of switching tabs), s searches in the file,
# d goes to the definition, f finds all references, e searches all files
# (instead of moving the pointer).
[code]
nav.q = C-A-minus
nav.w = C-S-minus
nav.s = C-f
nav.d = f12
nav.f = S-A-f12
nav.e = C-S-f
mousemode.q = C-A-minus
mousemode.w = C-S-minus
mousemode.s = C-f
mousemode.d = f12
mousemode.f = S-A-f12
mousemode.e = C-S-f

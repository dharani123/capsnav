# Per-app overrides for capsnav, applied by keyd-application-mapper while a
# matching window has focus (window class; see `keyd-application-mapper -v`).
# Installed to ~/.config/keyd/app.conf. Bindings are for mouse mode
# (mousemode.X).

# VS Code: q/w step back/forward through where you've been (instead of
# switching tabs). h clicks where the pointer is, then goes to the
# definition (F12): hover a name and tap h. The pause lets VS Code move the
# cursor before F12. The pointer keys (e/s/d/f, r/c/v) stay as pointer keys.
[code]
mousemode.q = C-A-minus
mousemode.w = C-S-minus
mousemode.h = macro(leftmouse 50ms f12)

[ids]
*

[global]
# A Caps tap (below) only counts if Caps was released within 200 ms.
overload_tap_timeout = 200

[main]
# Tap Caps Lock (released within 200 ms, no other key) to toggle mouse mode.
# Hold it for text mode ([textmode]): the text editing keys.
capslock = overload(textmode, toggle(mousemode))

# Text mode (Caps held, in keyboard or mouse mode): text editing keys. Other typing keys
# do nothing (capsnav-capsblock), so Caps+key is the same in both modes.
[textmode]
include capsnav-capsblock
# Caps+o: Backspace, so you can delete without leaving the home row.
o = backspace

# Caps+i/j/k/l: arrow keys.
i = up
j = left
k = down
l = right

# Caps+t/b: top / bottom of the file; h/;: start / end of the line.
t = C-home
b = C-end
h = home
semicolon = end

# Caps+u/d: page up / page down.
u = pageup
d = pagedown

# Caps+q/w: previous / next word.
q = C-left
w = C-right

# Caps+Space: hold Space as well to select while moving (adds Shift), e.g.
# Caps+Space+q selects the previous word.
space = layer(shift)

# Mouse mode (tap Caps): all the bindings in capsnav-nav. The top-bar icon
# shows a mouse while it's on, a keyboard while off. Space speeds up scrolling,
# so it doesn't type a space until you leave.
[mousemode]
include capsnav-nav
# Hold b for the window switcher: j/l (or s/f) move, release b to pick. (A tap is a
# quick Alt+Tab to the previous window.) Relies on capsnav's keyd patch that
# keeps Alt held through layerm's macro.
b = layerm(winswitch, A-tab)
# Lock the screen, leaving mouse mode first so the password can be typed.
0 = togglem(mousemode, M-l)
# Hold Caps for text mode ([textmode]). Tap Caps to leave; that clicks
# first, so the text cursor lands where the pointer is and you can type
# straight away.
capslock = overload(textmode, togglem(mousemode, leftmouse))

# Ctrl held in mouse mode: you're typing a shortcut, so keys type as
# themselves with Ctrl (Ctrl+c is a plain Ctrl+c, Ctrl+Shift+t reopens a tab).
# keyd drops Ctrl from bindings in a layer built on control, so each one
# adds it back. Every key mouse mode takes over; keep it in step with
# capsnav-nav.
[mousemode+control]
i = C-i
j = C-j
k = C-k
l = C-l
e = C-e
s = C-s
d = C-d
f = C-f
x = C-x
z = C-z
g = C-g
h = C-h
semicolon = C-semicolon
a = C-a
q = C-q
w = C-w
t = C-t
y = C-y
c = C-c
v = C-v
7 = C-7
0 = C-0
p = C-p
o = C-o
r = C-r
u = C-u
n = C-n
m = C-m
space = C-space
b = C-b

[scrolldown]

[scrollup]

[esdfup]

[esdfleft]

[esdfdown]

[esdfright]


# Space held in mouse mode: n/m (and v/c) scroll 6x faster. Empty; capsnav-scroll
# watches it.
[fastscroll]

[ijklleft]

[ijklright]

[ijklup]

[ijkldown]

# Active while b is held in mouse mode; holds Alt so the switcher stays open.
[winswitch:A]
b = A-tab
j = A-left
l = A-right
# Left-hand pair (esdf cluster)
s = A-left
f = A-right

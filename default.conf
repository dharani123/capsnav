[ids]
*

[global]
# A left Shift tap (below) only counts if Shift was released within 200 ms.
overload_tap_timeout = 200

[main]
# Hold Caps Lock to activate the nav layer
capslock = layer(nav)
# Tap left Shift alone to toggle mouse mode; hold it as a normal Shift.
leftshift = overload(shift, toggle(mousemode))

[nav]
# All Caps bindings live in capsnav-nav, shared with mouse mode.
include capsnav-nav
# Window switcher: Caps+b = Alt+Tab; keep Caps held and tap b to cycle,
# j/l to move, release Caps to pick.
b = swapm(winswitch, A-tab)

# Mouse mode (tap left Shift): the same bindings, locked on without holding
# Caps. The mouse helper shows a mouse icon in the top bar.
# Space acts as in Caps+Space (arrows / fast scroll), so it doesn't type a
# space until you leave.
[mousemode]
include capsnav-nav
# Hold b for the window switcher: j/l move, release b to pick. (A tap is a
# quick Alt+Tab to the previous window.) Relies on capsnav's keyd patch that
# keeps Alt held through layerm's macro.
b = layerm(winswitch, A-tab)
# Leaving mouse mode with a left Shift tap clicks first, so the text cursor
# lands where the pointer is and you can type straight away. (Entering is a
# plain toggle; held, left Shift is still Shift.)
leftshift = overload(shift, togglem(mousemode, leftmouse))
# Lock the screen, leaving mouse mode first so the password can be typed.
0 = togglem(mousemode, M-l)
# Hold Caps for the normal keyboard, e.g. Caps+Ctrl+Shift+t, without
# leaving mouse mode.
capslock = layer(mousetype)

# Active while Caps is held in mouse mode: every key mouse mode takes over
# types as itself again. Keep in step with capsnav-nav and [mousemode].
[mousetype]
i = i
j = j
k = k
l = l
e = e
s = s
d = d
f = f
x = x
g = g
h = h
semicolon = semicolon
q = q
w = w
t = t
y = y
c = c
v = v
o = o
r = r
a = a
8 = 8
9 = 9
7 = 7
0 = 0
p = p
u = u
n = n
m = m
space = space
b = b
leftshift = layer(shift)

# [mousemode+alt] (below) would otherwise win over [mousetype].
[mousemode+mousetype+alt]
j = A-j
l = A-l

[scrolldown]

[scrollup]

[esdfup]

[esdfleft]

[esdfdown]

[esdfright]

[pointermode]


# Caps+Space+i/j/k/l: arrow keys instead of mouse movement; Caps+Space+n/m:
# scroll at double speed. Other keys still work as in [nav].
[arrows]
i = up
j = left
k = down
l = right

[ijklleft]

[ijklright]

[ijklup]

[ijkldown]

# Active while Caps is held after Caps+b (or while b is held in mouse mode);
# holds Alt so the switcher stays open.
[winswitch:A]
b = A-tab
j = A-left
l = A-right

# Caps+Alt: switch tabs (Chrome, Firefox, VS Code, GNOME Terminal).
# Must come after [nav]; Alt itself is dropped from the output.
[nav+alt]
j = C-pageup
l = C-pagedown

[mousemode+alt]
j = C-pageup
l = C-pagedown

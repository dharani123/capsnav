[ids]
*

[main]
# Hold Caps Lock to activate the nav layer
capslock = layer(nav)

[nav]
# Mouse: i/j/k/l move the pointer (up/left/down/right). The empty layers are
# watched by capsnav-scroll --mouse. g = left button (tap to click, hold and
# move to select text or drag), ; = right click. Buttons stay down while the
# key is held.
i = layer(ijklup)
j = layer(ijklleft)
k = layer(ijkldown)
l = layer(ijklright)
# e/s/d/f: up/left/down/right on the left hand. Whether each cluster (i/j/k/l,
# e/s/d/f) moves the pointer or snaps it to that screen edge depends on the
# pointer mode; x cycles it (both move / e-s-d-f snap / i-j-k-l snap).
e = layer(esdfup)
s = layer(esdfleft)
d = layer(esdfdown)
f = layer(esdfright)
x = layer(pointermode)
g = leftmouse
# Left click on the right hand as well
h = leftmouse
semicolon = rightmouse
t = C-home
# Tabs (browsers, VS Code, terminals): q = previous, w = next
q = C-pageup
w = C-pagedown
# Copy / paste, terminal style (Ctrl+Shift+C/V)
c = C-S-c
v = C-S-v
y = home
o = end
# VS Code: go to definition, go to symbol in file, go back, go forward
r = f12
a = C-S-o
8 = C-A-minus
9 = C-S-minus
# PrtSc (screenshot). The physical PrtSc key sends KEY_SYSRQ.
7 = sysrq
# Jump pointer + focus to the other monitor (GNOME shortcut -> capsnav-switch-monitor)
p = M-A-o
# Centre the pointer on the current monitor (GNOME shortcut -> capsnav-switch-monitor --center)
u = M-A-u
# Smooth scroll: these layers are watched by capsnav-scroll.py
n = layer(scrollup)
m = layer(scrolldown)
# Caps+Space: i/j/k/l become arrow keys (below)
space = layer(arrows)
# Window switcher: Caps+b = Alt+Tab; keep Caps held and tap b to cycle,
# j/l to move, release Caps to pick.
b = swapm(winswitch, A-tab)

[scrolldown]

[scrollup]

[esdfup]

[esdfleft]

[esdfdown]

[esdfright]

[pointermode]


# Caps+Space+i/j/k/l: arrow keys instead of mouse movement; Caps+Space+n/m:
# scroll at double speed. Other keys still work as in [nav].
[arrows]
i = up
j = left
k = down
l = right

[ijklleft]

[ijklright]

[ijklup]

[ijkldown]

# Active while Caps is held after Caps+b; holds Alt so the switcher stays open.
[winswitch:A]
b = A-tab
j = A-left
l = A-right

# Caps+Super+n/m: scroll at half speed like Caps+Alt (capsnav-scroll halves
# it while meta is active); listed here so Super isn't sent with the scroll.
[nav+meta]
n = layer(scrollup)
m = layer(scrolldown)

# Caps+Alt: switch tabs (Chrome, Firefox, VS Code, GNOME Terminal).
# Must come after [nav]; Alt itself is dropped from the output.
[nav+alt]
j = C-pageup
l = C-pagedown
# Caps+Alt+n/m: scroll (capsnav-scroll halves the speed while alt is active;
# listed here so Alt isn't sent along with the scroll)
n = layer(scrollup)
m = layer(scrolldown)

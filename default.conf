[ids]
*

[main]
# Hold Caps Lock to activate the nav layer
capslock = layer(nav)

[nav]
# Mouse: i/j/k/l move the pointer (up/left/down/right). The empty layers are
# watched by capsnav-scroll --mouse. g = left button (tap to click, hold and
# move to select text or drag), ; = right click. Buttons stay down while the
# key is held.
i = layer(mouseup)
j = layer(mouseleft)
k = layer(mousedown)
l = layer(mouseright)
# Same movement on the left hand (e/s/d/f), for when the right hand needs a rest
e = layer(mouseup)
s = layer(mouseleft)
d = layer(mousedown)
f = layer(mouseright)
g = leftmouse
# Right-hand left click, for when the left hand is moving (e/s/d/f)
h = leftmouse
semicolon = rightmouse
t = C-home
w = C-end
# Copy / paste, terminal style (Ctrl+Shift+C/V)
c = C-S-c
v = C-S-v
y = home
o = end
# VS Code: go to definition, go to symbol in file, go back, go forward
r = f12
a = C-S-o
8 = C-A-minus
9 = C-S-minus
# Jump pointer + focus to the other monitor (GNOME shortcut -> capsnav-switch-monitor)
p = M-A-o
# Centre the pointer on the current monitor (GNOME shortcut -> capsnav-switch-monitor --center)
u = M-A-u
# Smooth scroll: these layers are watched by capsnav-scroll.py
n = layer(scrollup)
m = layer(scrolldown)
# Caps+Space: i/j/k/l become arrow keys (below)
space = layer(arrows)
# Window switcher: Caps+b = Alt+Tab; keep Caps held and tap b to cycle,
# j/l to move, release Caps to pick.
b = swapm(winswitch, A-tab)

[scrolldown]

[scrollup]

[scrolldownfast]

[scrollupfast]

# Caps+Space+i/j/k/l: arrow keys instead of mouse movement; Caps+Space+n/m:
# scroll at double speed. Other keys still work as in [nav].
[arrows]
i = up
j = left
k = down
l = right
n = layer(scrollupfast)
m = layer(scrolldownfast)

[mouseleft]

[mouseright]

[mouseup]

[mousedown]

# Active while Caps is held after Caps+b; holds Alt so the switcher stays open.
[winswitch:A]
b = A-tab
j = A-left
l = A-right

# Caps+Alt: switch tabs (Chrome, Firefox, VS Code, GNOME Terminal).
# Must come after [nav]; Alt itself is dropped from the output.
[nav+alt]
j = C-pageup
l = C-pagedown

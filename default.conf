[ids]
*

[main]
# Hold Caps Lock to activate the nav layer
capslock = layer(nav)

[nav]
u = up
n = down
h = left
l = right
m = backspace
t = C-home
v = C-end
y = home
o = end
i = esc
# Smooth scroll: these layers are watched by capsnav-scroll.py
j = layer(scrollup)
k = layer(scrolldown)

[scrolldown]

[scrollup]

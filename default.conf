[ids]
*

[main]
# Hold Caps Lock to activate the nav layer
capslock = layer(nav)

[nav]
u = up
n = down
h = left
l = right
m = backspace
t = C-home
v = C-end
y = home
o = end
i = esc
# VS Code: go to definition, go to symbol in file, go back, go forward
d = f12
semicolon = C-S-o
8 = C-A-minus
9 = C-S-minus
# Jump pointer + focus to the other monitor (GNOME shortcut -> capsnav-switch-monitor)
p = M-A-o
# Click hints on screen, type one to click it (GNOME shortcut -> ~/.local/bin/hints)
g = M-A-f
# Smooth scroll: these layers are watched by capsnav-scroll.py
j = layer(scrollup)
k = layer(scrolldown)

[scrolldown]

[scrollup]

# Caps+Alt: switch tabs (Chrome, Firefox, VS Code, GNOME Terminal).
# Must come after [nav]; Alt itself is dropped from the output.
[nav+alt]
h = C-pageup
l = C-pagedown

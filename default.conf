[ids]
*

[main]
# Hold Caps Lock to activate the nav layer
capslock = layer(nav)

[nav]
i = up
j = left
k = down
l = right
u = esc
h = backspace
t = C-home
v = C-end
y = home
o = end
# VS Code: go to definition, go to symbol in file, go back, go forward
d = f12
semicolon = C-S-o
8 = C-A-minus
9 = C-S-minus
# Jump pointer + focus to the other monitor (GNOME shortcut -> capsnav-switch-monitor)
p = M-A-o
# Smooth scroll: these layers are watched by capsnav-scroll.py
n = layer(scrollup)
m = layer(scrolldown)
# Caps+Space: mouse layer (below)
space = layer(mouse)
# Window switcher: Caps+b = Alt+Tab; keep Caps held and tap b to cycle,
# j/l to move, release Caps to pick.
b = swapm(winswitch, A-tab)

[scrolldown]

[scrollup]

# Caps+Space+i/j/k/l: move the pointer (up/left/down/right). The empty layers
# are watched by capsnav-scroll --mouse; other keys still work as in [nav].
[mouse]
i = layer(mouseup)
j = layer(mouseleft)
k = layer(mousedown)
l = layer(mouseright)
# Clicks; the button is held while the key is.
n = leftmouse
m = rightmouse
# Hold left button with the left hand (index finger) while i/j/k/l move:
# select text or drag, release g to drop.
g = leftmouse

[mouseleft]

[mouseright]

[mouseup]

[mousedown]

# Active while Caps is held after Caps+b; holds Alt so the switcher stays open.
[winswitch:A]
b = A-tab
j = A-left
l = A-right

# Caps+Alt: switch tabs (Chrome, Firefox, VS Code, GNOME Terminal).
# Must come after [nav]; Alt itself is dropped from the output.
[nav+alt]
j = C-pageup
l = C-pagedown

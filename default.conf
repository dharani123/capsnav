[ids]
*

[global]
# A Caps tap (below) only counts if Caps was released within 200 ms.
overload_tap_timeout = 200

[main]
# Tap Caps Lock (released within 200 ms, no other key) to toggle mouse mode.
# Hold it for text mode ([textmode]): the text editing keys.
capslock = overload(textmode, toggle(mousemode))

# Text mode (Caps held, in keyboard or mouse mode): text editing keys. Other typing keys
# do nothing (capsnav-capsblock), so Caps+key is the same in both modes.
[textmode]
include capsnav-capsblock
# Caps+b: Backspace.
b = backspace

# Caps+i/j/k/l: arrow keys.
i = up
j = left
k = down
l = right

# Caps+t/g: top / bottom of the file; h/;: start / end of the line.
t = C-home
g = C-end
h = home
semicolon = end

# Caps+u/d: page up / page down.
u = pageup
d = pagedown

# Caps+q/w: previous / next word.
q = C-left
w = C-right

# Caps+n/m: smooth scroll left / right (capsnav-scroll watches the layers).
n = layer(scrollleft)
m = layer(scrollright)

# Caps+c/x/v: copy / cut / paste. With Space too: Ctrl+Shift+c/v (terminal
# copy/paste).
c = C-c
x = C-x
v = C-v

# Caps+a: select all. Caps+z: undo; with Space too: Ctrl+Shift+z (redo).
a = C-a
z = C-z

# Caps+f: find. With Space too: Ctrl+Shift+f (VS Code: search all files).
f = C-f

# Caps+Space: tap for Enter. Hold Space as well to select while moving (adds
# Shift), e.g. Caps+Space+q selects the previous word. Also makes n/m scroll
# 6x faster.
space = overload(textshift, enter)

# Mouse mode (tap Caps): all the bindings in capsnav-nav. The top-bar icon
# shows a mouse while it's on, a keyboard while off. Space doesn't type a
# space until you leave.
[mousemode]
include capsnav-nav
# Hold Space for the window switcher: j/l (or s/f) move, release Space to
# pick. (A tap is a quick Alt+Tab to the previous window.) Relies on capsnav's
# keyd patch that keeps Alt held through layerm's macro. Already scrolling?
# Then Space speeds the scroll up instead (see [scrollup]).
space = layerm(winswitch, A-tab)
# Lock the screen, leaving mouse mode first so the password can be typed.
0 = togglem(mousemode, M-l)
# Hold Caps for text mode ([textmode]). Tap Caps to leave; that clicks
# first, so the text cursor lands where the pointer is and you can type
# straight away.
capslock = overload(textmode, togglem(mousemode, leftmouse))

# Ctrl held in mouse mode: you're typing a shortcut, so keys type as
# themselves with Ctrl (Ctrl+c is a plain Ctrl+c, Ctrl+Shift+t reopens a tab).
# keyd drops Ctrl from bindings in a layer built on control, so each one
# adds it back. Every key mouse mode takes over; keep it in step with
# capsnav-nav.
[mousemode+control]
i = C-i
j = C-j
k = C-k
l = C-l
e = C-e
s = C-s
d = C-d
f = C-f
x = C-x
z = C-z
g = C-g
h = C-h
semicolon = C-semicolon
a = C-a
q = C-q
w = C-w
t = C-t
y = C-y
c = C-c
v = C-v
7 = C-7
1 = C-1
2 = C-2
tab = C-tab
3 = C-3
minus = C-minus
f11 = C-f11
end = C-end
f2 = C-f2
f10 = C-f10
delete = C-delete
grave = C-grave
equal = C-equal
rightbrace = C-rightbrace
backslash = C-backslash
leftbrace = C-leftbrace
f1 = C-f1
backspace = C-backspace
0 = C-0
p = C-p
o = C-o
r = C-r
u = C-u
n = C-n
m = C-m
space = C-space
b = C-b

# n/m (or v/c) held in mouse mode: press Space as well to scroll 6x faster.
[scrolldown]
space = layer(fastscroll)

[scrollup]
space = layer(fastscroll)

# Caps+Space in text mode: Shift, under its own name so capsnav-scroll can
# tell it from the Shift key (it speeds up Caps+n/m).
[textshift:S]

[scrollleft]

[scrollright]

[esdfup]

[esdfleft]

[esdfdown]

[esdfright]


# Space pressed while scrolling in mouse mode: n/m (and v/c) scroll 6x faster.
# Empty; capsnav-scroll watches it.
[fastscroll]

[ijklleft]

[ijklright]

[ijklup]

[ijkldown]

# Active while Space is held in mouse mode; holds Alt so the switcher stays
# open. b steps forward too.
[winswitch:A]
b = A-tab
j = A-left
l = A-right
# Left-hand pair (esdf cluster)
s = A-left
f = A-right
# Controller grip D-pads (see capsnav-nav)
grave = A-left
2 = A-right
minus = A-left
backspace = A-right

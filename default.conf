[ids]
*

[main]
# Hold Caps Lock to activate the nav layer
capslock = layer(nav)

[nav]
u = up
n = down
h = left
l = right
m = backspace
t = C-home
v = C-end
y = home
o = end
i = esc
# VS Code: go to definition, go to symbol in file, go back, go forward
d = f12
semicolon = C-S-o
8 = C-A-minus
9 = C-S-minus
# Smooth scroll: these layers are watched by capsnav-scroll.py
j = layer(scrollup)
k = layer(scrolldown)

[scrolldown]

[scrollup]

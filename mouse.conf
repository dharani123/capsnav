# capsnav mouse settings: smooth scrolling (Caps+n up / Caps+m down) and
# pointer motion (Caps+i/j/k/l).
# Live copy: /etc/capsnav/mouse.conf. Changes apply on the next scroll or
# move; no restart needed. Any setting left out uses its default.
#
# Both use a spring, so speed builds and fades along a smooth S-curve.
# Preview scroll values without installing: tools/scroll-curve.py 50/100 100/200

# --- Scrolling (Caps+n / Caps+m) ---

# Top speed, in mouse-wheel clicks per second (1 click is ~3 lines).
# Lower is slower; Caps+Space+n/m scroll at three times this, Caps+Alt+n/m or
# Caps+Super+n/m at half.
# Default 7.
# With vsync on, speed snaps to whole steps per frame; on a ~60 Hz screen:
# 2.4 = 2 steps/frame, 3.6 = 3, 4.8 = 4, 6 = 5. Smaller steps also look
# smoother.
scroll_speed = 2.4

# Time to reach ~90% of full speed after pressing, in milliseconds.
# Under ~100 feels instant; higher feels gentler. 0 = no easing. Default 100.
scroll_ease_in_ms = 120

# Time to glide to a stop after releasing, in milliseconds.
# Higher means a longer, softer stop. 0 = stop immediately. Default 200.
scroll_ease_out_ms = 120

# --- Pointer (Caps+i/j/k/l) ---

# Top speed, in pixels per second. Default 1000.
pointer_speed = 1000

# Time to reach ~90% of full speed after pressing, in milliseconds. Slower
# than scrolling, so a quick tap nudges the pointer a few pixels for precise
# positioning. At 1000 px/s a 50 ms tap moves ~48 px at 120, ~13 px at 300,
# ~10 px at 350, ~8 px at 400, ~3 px at 600. Default 400.
pointer_ease_in_ms = 400

# Time to glide to a stop after releasing, in milliseconds. A click while the
# pointer is still gliding turns into a drag, so keep it short. From full
# speed: 80 glides ~40 px over ~100 ms, 120 ~60 px over ~150 ms (a smooth
# stop; pause a moment before clicking), 200 ~100 px (slides a lot), 0 stops
# dead but feels abrupt. Default 120.
pointer_ease_out_ms = 120

# Snapping (Caps+e/s/d/f or Caps+i/j/k/l, depending on the Caps+x pointer
# mode) jumps the pointer to that edge of its screen, keeping the other
# coordinate. How far inside the edge it lands, in pixels (40 clears GNOME's
# top bar). Default 40.
pointer_snap_margin_px = 40

# --- Shared ---

# Scrolling in step with the screen: 1 = send one scroll step per screen
# refresh (every frame moves the same distance, no stutter from a timer
# drifting against the display); 0 = use tick_hz below instead.
vsync = 1

# Which display pipe to follow. On this laptop: 0 = laptop screen (eDP),
# 1 = HDMI monitor. The other screen drifts slightly (a small hitch every few
# seconds). Default 0.
vsync_crtc = 0

# Events per second while moving. Even steps matter more than a high rate;
# try 60 to match a 60 Hz screen. Default 120.
tick_hz = 60

# capsnav mouse settings: smooth scrolling (Caps+n up / Caps+m down) and
# pointer motion (Caps+Space+i/j/k/l).
# Live copy: /etc/capsnav/mouse.conf. Changes apply on the next scroll or
# move; no restart needed. Any setting left out uses its default.
#
# Both use a spring, so speed builds and fades along a smooth S-curve.
# Preview scroll values without installing: tools/scroll-curve.py 50/100 100/200

# --- Scrolling (Caps+n / Caps+m) ---

# Top speed, in mouse-wheel clicks per second (1 click is ~3 lines).
# Lower is slower. Default 7.
scroll_speed = 6

# Time to reach ~90% of full speed after pressing, in milliseconds.
# Under ~100 feels instant; higher feels gentler. 0 = no easing. Default 100.
scroll_ease_in_ms = 120

# --- Pointer (Caps+Space+i/j/k/l) ---

# Top speed, in pixels per second. Default 1000.
pointer_speed = 1000

# Time to reach ~90% of full speed after pressing, in milliseconds. Slower
# than scrolling, so a quick tap nudges the pointer a few pixels for precise
# positioning. At 1000 px/s a 50 ms tap moves ~48 px at 120, ~13 px at 300,
# ~8 px at 400, ~3 px at 600. Default 300.
pointer_ease_in_ms = 300

# --- Shared ---

# Time to glide to a stop after releasing, in milliseconds.
# Higher means a longer, softer stop. 0 = stop immediately. Default 200.
ease_out_ms = 120

# Events per second while moving. Even steps matter more than a high rate;
# try 60 to match a 60 Hz screen. Default 120.
tick_hz = 60

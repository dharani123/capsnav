# capsnav smooth scroll settings (Caps+j up / Caps+k down).
# Live copy: /etc/capsnav/scroll.conf. Changes apply on the next scroll;
# no restart needed. Any setting left out uses its default.

# Top speed, in mouse-wheel clicks per second (1 click is ~3 lines).
# Lower is slower. Default 7; the first version used 12.5.
speed = 6

# How long it takes to speed up after pressing, in milliseconds.
# Higher feels gentler. 0 = full speed immediately (linear). Default 120.
ease_in_ms = 50 

# How long it glides to a stop after releasing, in milliseconds.
# Higher means a longer glide. 0 = stop immediately (linear). Default 80.
ease_out_ms = 100

# capsnav smooth scroll settings (Caps+n up / Caps+m down), also used for
# pointer motion (Caps+Space+i/j/k/l).
# Live copy: /etc/capsnav/scroll.conf. Changes apply on the next scroll;
# no restart needed. Any setting left out uses its default.

# Top pointer speed for Caps+Space+i/j/k/l, in pixels per second. It uses the
# same easing and tick rate as scrolling. Default 1000.
mouse_speed = 1000

# Top speed, in mouse-wheel clicks per second (1 click is ~3 lines).
# Lower is slower. Default 7.
speed = 6

# Easing uses a spring, so speed builds and fades along a smooth S-curve.
# Preview any values without installing: tools/scroll-curve.py 50/100 100/200

# Time to reach ~90% of full speed after pressing, in milliseconds.
# Under ~100 feels instant; higher feels gentler. 0 = no easing. Default 100.
ease_in_ms = 120

# Time to glide to a stop after releasing, in milliseconds.
# Higher means a longer, softer stop. 0 = stop immediately. Default 200.
ease_out_ms = 120

# Scroll events per second. Even steps matter more than a high rate;
# try 60 to match a 60 Hz screen. Default 120.
tick_hz = 60